<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PhishNetra</title>
    <!-- Google Fonts: Orbitron for Futuristic Headers & Space Grotesk for body -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <!-- Sweeping Laser Scanline -->
    <div class="scanline"></div>

    <div class="header">
        <div class="logo-container">
            <!-- Holographic Radar Target Ring -->
            <div class="scanner-ring"></div>
            <img src="logo.png" alt="PhishNetra Logo" class="main-logo">
        </div>
        <label class="toggle-switch main-toggle-container">
            <input type="checkbox" id="main-toggle" checked>
            <span class="slider round"></span>
        </label>
    </div>

    <div class="content">
        <!-- Main Status Card -->
        <div class="card status-card" id="status-card">
            <div class="card-content">
                <h2 id="current-status">Analyzing...</h2>
                <p id="current-domain" class="domain-text">...</p>

                <!-- Nested Risk Score Container -->
                <div class="score-display">
                    <span class="score-label">RISK SCORE</span>
                    <span class="score-value" id="risk-score">--/100</span>
                </div>

                <!-- Futuristic Segmented Progress Bar -->
                <div class="risk-meter-bar" id="risk-meter-bar">
                    <div class="meter-block" data-index="1"></div>
                    <div class="meter-block" data-index="2"></div>
                    <div class="meter-block" data-index="3"></div>
                    <div class="meter-block" data-index="4"></div>
                    <div class="meter-block" data-index="5"></div>
                    <div class="meter-block" data-index="6"></div>
                    <div class="meter-block" data-index="7"></div>
                    <div class="meter-block" data-index="8"></div>
                    <div class="meter-block" data-index="9"></div>
                    <div class="meter-block" data-index="10"></div>
                </div>
            </div>
        </div>

        <!-- Analysis Details Card -->
        <div class="card reasons-section" id="reasons-section" style="padding: 16px 20px;">
            <div class="info-grid" style="border-top: none; padding-top: 0; margin-bottom: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: center;">
                <div class="info-col" style="display: flex; flex-direction: column; gap: 4px; align-items: center;">
                    <span class="info-label" style="font-size: 0.68rem; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">SSL STATUS</span>
                    <span class="info-val" id="info-ssl" style="font-size: 0.82rem; font-weight: 700; color: #cbd5e1;">...</span>
                </div>
                <div class="info-col" style="display: flex; flex-direction: column; gap: 4px; align-items: center;">
                    <span class="info-label" style="font-size: 0.68rem; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">DOMAIN AGE</span>
                    <span class="info-val" id="info-age" style="font-size: 0.82rem; font-weight: 700; color: #cbd5e1;">...</span>
                </div>
            </div>
            
            <div style="font-size: 0.72rem; color: #64748b; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; border-top: 1px solid rgba(255, 255, 255, 0.03); padding-top: 12px; margin-bottom: 8px;">DETECTED RISK SIGNALS</div>
            
            <div class="signals-container">
                <ul id="reasons-list" style="margin: 0; padding-left: 18px; font-size: 0.85rem; color: #cbd5e1; line-height: 1.5;">
                    <li>Please wait...</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
