<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PhishNetra</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <div class="logo-container">
            <img src="logo.png" alt="PhishNetra Logo" class="main-logo">
        </div>
        <label class="toggle-switch main-toggle-container">
            <input type="checkbox" id="main-toggle" checked>
            <span class="slider round"></span>
        </label>
    </div>

    <div class="content">
        <div class="card status-card" id="status-card">
            <div class="glow-bg" id="card-glow"></div>
            <div class="card-content">
                <h2 id="current-status">Analyzing...</h2>
                <p id="current-domain" class="domain-text">...</p>

                <div class="score-display">
                    <span class="score-label">RISK SCORE</span>
                    <span class="score-value" id="risk-score"><span class="score-number">--</span>/100</span>
                </div>

                <!-- Futuristic Segmented Progress Bar -->
                <div class="risk-meter-bar" id="risk-meter-bar">
                    <div class="meter-block" data-index="1"></div>
                    <div class="meter-block" data-index="2"></div>
                    <div class="meter-block" data-index="3"></div>
                    <div class="meter-block" data-index="4"></div>
                    <div class="meter-block" data-index="5"></div>
                    <div class="meter-block" data-index="6"></div>
                    <div class="meter-block" data-index="7"></div>
                    <div class="meter-block" data-index="8"></div>
                    <div class="meter-block" data-index="9"></div>
                    <div class="meter-block" data-index="10"></div>
                </div>
            </div>
        </div>

        <div class="card reasons-section" id="reasons-section">
            <div class="reasons-header" id="reasons-toggle">
                <h3>ANALYSIS DETAILS</h3>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="reasons-body" id="reasons-body" style="display: none;">
                <ul id="reasons-list">
                    <li>Please wait...</li>
                </ul>
            </div>
        </div>

        <!-- Website Information Card -->
        <div class="card info-section">
            <div class="info-header">
                <h3>WEBSITE INFORMATION</h3>
            </div>
            <div class="info-grid">
                <div class="info-col">
                    <span class="info-label">DOMAIN</span>
                    <span class="info-val" id="info-domain">...</span>
                </div>
                <div class="info-col">
                    <span class="info-label">SSL STATUS</span>
                    <span class="info-val" id="info-ssl">...</span>
                </div>
                <div class="info-col">
                    <span class="info-label">DOMAIN AGE</span>
                    <span class="info-val" id="info-age">...</span>
                </div>
            </div>
        </div>

        <div class="card settings-section">
            <div class="setting-row">
                <div>
                    <strong>Protection Mode</strong>
                    <p class="setting-desc">Proactively blocks dangerous sites.</p>
                </div>
                <label class="toggle-switch small">
                    <input type="checkbox" id="protection-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>


        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
